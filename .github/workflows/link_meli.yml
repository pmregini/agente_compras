name: Vincular Mercado Libre

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Código 'code' que copiaste de la URL después de autorizar la app"
        required: true

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Intercambiar code por tokens
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AUTH_CODE: ${{ github.event.inputs.code }}
        run: python link_meli.py

      - name: Guardar ml_token.json
        run: |
          git config user.name "agente-bot"
          git config user.email "agente-bot@users.noreply.github.com"
          git add ml_token.json
          git commit -m "vincular cuenta ML [skip ci]"
          git push
