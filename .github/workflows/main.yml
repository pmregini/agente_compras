name: Agente de compras

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min (UTC)
  workflow_dispatch: {}       # permite correrlo manualmente

permissions:
  contents: write            # necesario para el commit y push

concurrency:
  group: agente-compras
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests feedparser

      - name: Correr agente
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_compras.py

      - name: Guardar cambios (vistos.txt)
        run: |
          git config user.name "agente-bot"
          git config user.email "agente-bot@users.noreply.github.com"
          git add vistos.txt
          git diff --staged --quiet || (git commit -m "update estado [skip ci]" && git push)
